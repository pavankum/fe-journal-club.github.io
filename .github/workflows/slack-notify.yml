name: Notify Slack

on:
  workflow_dispatch:
    inputs:
      article_title:
        description: 'Article title'
        required: true
      article_link:
        description: 'Article link'
        required: true
      suggested_by:
        description: 'Suggested by'
        required: true
      article_authors:
        description: 'Authors / Journal'
        required: false
      proposed_date:
        description: 'Proposed discussion date'
        required: false
      article_notes:
        description: 'Notes'
        required: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          TITLE="${{ github.event.inputs.article_title }}"
          LINK="${{ github.event.inputs.article_link }}"
          BY="${{ github.event.inputs.suggested_by }}"
          AUTHORS="${{ github.event.inputs.article_authors }}"
          DATE="${{ github.event.inputs.proposed_date }}"
          NOTES="${{ github.event.inputs.article_notes }}"
          SITE="https://pavankum.github.io/fe-journal-club.github.io/"

          # Build fields array conditionally
          FIELDS="[
            {\"type\": \"mrkdwn\", \"text\": \"*Title*\n<$LINK|$TITLE>\"},
            {\"type\": \"mrkdwn\", \"text\": \"*Suggested by*\n$BY\"}"

          if [ -n "$AUTHORS" ]; then
            FIELDS="$FIELDS, {\"type\": \"mrkdwn\", \"text\": \"*Authors / Journal*\n$AUTHORS\"}"
          fi
          if [ -n "$DATE" ]; then
            FIELDS="$FIELDS, {\"type\": \"mrkdwn\", \"text\": \"*Proposed date*\n$DATE\"}"
          fi
          FIELDS="$FIELDS]"

          # Build blocks
          BLOCKS="[
            {\"type\": \"section\", \"text\": {\"type\": \"mrkdwn\", \"text\": \"📄 *New article suggested for journal club*\"}},
            {\"type\": \"section\", \"fields\": $FIELDS}"

          if [ -n "$NOTES" ]; then
            BLOCKS="$BLOCKS, {\"type\": \"section\", \"text\": {\"type\": \"mrkdwn\", \"text\": \"*Notes*\n$NOTES\"}}"
          fi

          BLOCKS="$BLOCKS,
            {\"type\": \"divider\"},
            {\"type\": \"section\", \"text\": {\"type\": \"mrkdwn\", \"text\": \"<$SITE|👆 Vote on this article>\"}}
          ]"

          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"blocks\": $BLOCKS}"
