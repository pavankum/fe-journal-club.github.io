name: Notify Slack

on:
  workflow_dispatch:
    inputs:
      article_title:
        description: 'Article title'
        required: true
      article_link:
        description: 'Article link'
        required: true
      suggested_by:
        description: 'Suggested by'
        required: true
      article_authors:
        description: 'Authors / Journal'
        required: false
      proposed_date:
        description: 'Proposed discussion date'
        required: false
      article_notes:
        description: 'Notes'
        required: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ARTICLE_TITLE:     ${{ github.event.inputs.article_title }}
          ARTICLE_LINK:      ${{ github.event.inputs.article_link }}
          SUGGESTED_BY:      ${{ github.event.inputs.suggested_by }}
          ARTICLE_AUTHORS:   ${{ github.event.inputs.article_authors }}
          PROPOSED_DATE:     ${{ github.event.inputs.proposed_date }}
          ARTICLE_NOTES:     ${{ github.event.inputs.article_notes }}
          SITE:              "https://pavankum.github.io/fe-journal-club.github.io/"
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request

          title   = os.environ.get('ARTICLE_TITLE', '')
          link    = os.environ.get('ARTICLE_LINK', '')
          by      = os.environ.get('SUGGESTED_BY', 'Anonymous')
          authors = os.environ.get('ARTICLE_AUTHORS', '')
          date    = os.environ.get('PROPOSED_DATE', '')
          notes   = os.environ.get('ARTICLE_NOTES', '')
          site    = os.environ.get('SITE', '')
          webhook = os.environ.get('SLACK_WEBHOOK_URL', '')

          fields = [
            {"type": "mrkdwn", "text": f"*Title*\n<{link}|{title}>"},
            {"type": "mrkdwn", "text": f"*Suggested by*\n{by}"},
          ]
          if authors:
            fields.append({"type": "mrkdwn", "text": f"*Authors / Journal*\n{authors}"})
          if date:
            fields.append({"type": "mrkdwn", "text": f"*Proposed date*\n{date}"})

          blocks = [
            {"type": "section", "text": {"type": "mrkdwn", "text": "📄 *New article suggested for journal club*"}},
            {"type": "section", "fields": fields},
          ]
          if notes:
            blocks.append({"type": "section", "text": {"type": "mrkdwn", "text": f"*Notes*\n{notes}"}})

          blocks.append({"type": "divider"})
          blocks.append({"type": "section", "text": {"type": "mrkdwn", "text": f"<{site}|👆 Vote on this article>"}})

          payload = json.dumps({"blocks": blocks}).encode()
          req = urllib.request.Request(webhook, data=payload, headers={"Content-Type": "application/json"})
          res = urllib.request.urlopen(req)
          print(f"Slack responded: {res.status}")
          PYEOF
