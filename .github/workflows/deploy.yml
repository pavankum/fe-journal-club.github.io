name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets
        env:
          FIREBASE_API_KEY:      ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DB_URL:       ${{ secrets.FIREBASE_DB_URL }}
          JC_PASSWORD:           ${{ secrets.JC_PASSWORD }}
          EMAILJS_PUBLIC_KEY:    ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_SERVICE_ID:    ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID:   ${{ secrets.EMAILJS_TEMPLATE_ID }}
        run: |
          sed -i "s|__FIREBASE_API_KEY__|$FIREBASE_API_KEY|g"    index.html
          sed -i "s|__FIREBASE_DB_URL__|$FIREBASE_DB_URL|g"      index.html
          sed -i "s|__JC_PASSWORD__|$JC_PASSWORD|g"              index.html
          sed -i "s|__EMAILJS_PUBLIC_KEY__|$EMAILJS_PUBLIC_KEY|g" index.html
          sed -i "s|__EMAILJS_SERVICE_ID__|$EMAILJS_SERVICE_ID|g" index.html
          sed -i "s|__EMAILJS_TEMPLATE_ID__|$EMAILJS_TEMPLATE_ID|g" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
